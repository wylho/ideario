# Verifica o projeto e gera os instaladores de macOS, Windows e Linux a cada push.
# Os instaladores ficam nos "Artifacts" da execução (aba Actions do GitHub).
name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificar (tipos, testes e2e, núcleo, app nativo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Testes e2e
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Dependências do sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Testes do núcleo
        working-directory: src-tauri
        run: cargo test
      - name: Clippy (avisos viram erro)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes no app nativo (WebKitGTK via WebDriver)
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          npx tauri build --debug --no-bundle
          xvfb-run -a -s "-screen 0 1400x900x24" node tests/native/run.mjs

  bundle:
    name: Instalador (${{ matrix.name }})
    # Roda junto com a verificação, não depois: o instalador de cada commit sai mesmo se um teste falhar
    # (a verificação continua vermelha e aparece no commit).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
        env:
          # Cliente OAuth do Google (sync com o Drive). Sem os segredos no repositório, o app sai sem o sync.
          IDEARIO_GOOGLE_CLIENT_ID: ${{ secrets.IDEARIO_GOOGLE_CLIENT_ID }}
          IDEARIO_GOOGLE_CLIENT_SECRET: ${{ secrets.IDEARIO_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ideario-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
