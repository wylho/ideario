# Confere os segredos do lançamento sem mostrar nenhum valor: cada chave abre com a senha e assina um arquivo de
# teste. Rodar depois de criar ou trocar um segredo: Actions → Conferir segredos → Run workflow.
name: Conferir segredos

on:
  workflow_dispatch:

jobs:
  check:
    name: Conferir segredos
    runs-on: ubuntu-24.04
    env:
      GOOGLE_ID: ${{ secrets.IDEARIO_GOOGLE_CLIENT_ID }}
      GOOGLE_SECRET: ${{ secrets.IDEARIO_GOOGLE_CLIENT_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GPG_KEY: ${{ secrets.IDEARIO_GPG_PRIVATE_KEY }}
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # SHA-1 da chave do APK registrado no cliente OAuth "Android" (pacote app.ideario).
      ANDROID_SHA1: F8:0B:3C:C1:42:2C:87:EA:77:63:31:F0:CA:99:50:99:8D:B8:3C:F8
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Conferir
        run: |
          fail=0
          ok() { echo "✅ $1"; }
          bad() { echo "❌ $1"; fail=1; }

          [[ "$GOOGLE_ID" == *.apps.googleusercontent.com ]] && ok "IDEARIO_GOOGLE_CLIENT_ID" || bad "IDEARIO_GOOGLE_CLIENT_ID (vazio ou não termina em .apps.googleusercontent.com)"
          [[ -n "$GOOGLE_SECRET" ]] && ok "IDEARIO_GOOGLE_CLIENT_SECRET" || bad "IDEARIO_GOOGLE_CLIENT_SECRET (vazio)"

          echo teste > teste.txt
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then bad "TAURI_SIGNING_PRIVATE_KEY (vazio)"
          elif npx -y @tauri-apps/cli@2 signer sign teste.txt > /dev/null 2>&1 && [[ -s teste.txt.sig ]]; then
            ok "TAURI_SIGNING_PRIVATE_KEY + _PASSWORD (a chave abriu com a senha e assinou)"
          else bad "TAURI_SIGNING_PRIVATE_KEY ou _PASSWORD (a chave não abriu com a senha)"; fi

          if [[ -z "$GPG_KEY" ]]; then bad "IDEARIO_GPG_PRIVATE_KEY (vazio)"
          elif printf '%s\n' "$GPG_KEY" | gpg --batch --import > /dev/null 2>&1 && gpg --batch --yes --clearsign -o teste.asc teste.txt 2>/dev/null; then
            ok "IDEARIO_GPG_PRIVATE_KEY (importou e assinou)"
          else bad "IDEARIO_GPG_PRIVATE_KEY (não importou ou não assinou: copie todas as linhas, de BEGIN até END)"; fi

          if [[ -z "$KEYSTORE" ]]; then bad "ANDROID_KEYSTORE (vazio)"
          elif ! printf '%s' "$KEYSTORE" | base64 -d > ks.jks 2>/dev/null; then bad "ANDROID_KEYSTORE (não é base64 válido: copie a linha inteira)"
          else
            sha1=$(keytool -list -v -keystore ks.jks -alias ideario -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk '/SHA1:/ {print $2}')
            if [[ -z "$sha1" ]]; then bad "ANDROID_KEYSTORE ou _PASSWORD (o keystore não abriu com a senha)"
            elif [[ "$sha1" == "$ANDROID_SHA1" ]]; then ok "ANDROID_KEYSTORE + _PASSWORD (abriu; SHA-1 igual ao do cliente Android)"
            else bad "ANDROID_KEYSTORE (abriu, mas o SHA-1 é outro: $sha1)"; fi
          fi

          rm -f teste.* ks.jks
          exit $fail
