# Publica uma versão do Ideario na página Releases do GitHub, com os instaladores de macOS, Windows e Linux.
# Para lançar: Actions → Release → Run workflow (a versão vem de src-tauri/tauri.conf.json).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Instaladores (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDEARIO_GOOGLE_CLIENT_ID: ${{ secrets.IDEARIO_GOOGLE_CLIENT_ID }}
          IDEARIO_GOOGLE_CLIENT_SECRET: ${{ secrets.IDEARIO_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: Ideario v__VERSION__
          releaseBody: |
            Instaladores do Ideario v__VERSION__.

            - **macOS** (Apple Silicon e Intel): baixe o `.dmg`. Na primeira vez, clique com o botão direito no app → **Abrir** (o app ainda não é assinado pela Apple).
            - **Windows**: baixe o `.msi` ou o `-setup.exe`.
            - **Linux**: `.deb` (Ubuntu, Debian), `.rpm` (Fedora) ou `.AppImage`.

            Suas notas ficam só neste computador; a sincronização com o Google Drive chega numa próxima versão.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
