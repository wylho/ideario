[package]
name = "ideario"
version = "0.1.0"
description = "Ideario: notas local-first com sync pelo Google Drive"
edition = "2021"
rust-version = "1.80"

[lib]
# O sufixo evita conflito de nome com o binário no Windows.
name = "ideario_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Linux: lê a fonte e o destaque da área de trabalho (GNOME, KDE…) para a UI parecer nativa.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Windows: cor de destaque do sistema (registro do DWM), para o tema Sistema.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

# macOS: cor de destaque do sistema (NSColor.controlAccentColor), para o tema Sistema.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
