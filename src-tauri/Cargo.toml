[package]
name = "ideario"
version = "0.1.0"
description = "Ideario: notas local-first com sync pelo Google Drive"
edition = "2021"
rust-version = "1.80"

[lib]
# O sufixo evita conflito de nome com o binário no Windows.
name = "ideario_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Núcleo local (Fase 1): SQLite com FTS5 embutido, ids UUID v7, hash dos anexos, dimensões das imagens.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v5", "v7"] }
sha2 = "0.10"
imagesize = "0.13"
unicode-normalization = "0.1"
yrs = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
fast_image_resize = { version = "5", features = ["image"] }
webp = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8"
# Notificações dos lembretes (com botões Abrir, Adiar, Concluir nos três sistemas).
notify-rust = "4.18"
# Hora local dos lembretes (repetir todo mês/ano no mesmo horário, com horário de verão).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sync com o Google Drive (Fase 5): HTTP da API, navegador para o login, PKCE.
ureq = { version = "2", features = ["json"] }
tauri-plugin-opener = "2"
base64 = "0.22"
rand = "0.8"
# MCP (o Claude mexe nas notas): o corpo entra e sai em Markdown; a pasta de dados sem o Tauri (`ideario --mcp`).
pulldown-cmark = { version = "0.13", default-features = false }
dirs = "7"
# Bloco de link: endereço da imagem da página relativo ao da página.
url = "2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Chave do login Google (refresh token) no chaveiro do sistema (Mac e Windows; no Linux, arquivo só do usuário).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Linux: lê a fonte e o destaque da área de trabalho (GNOME, KDE…) para a UI parecer nativa.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# mesma versão da wry: liga a captura de áudio/vídeo (gravador e câmera), que a WebKitGTK traz desligada
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Windows: cor de destaque do sistema (registro do DWM), para o tema Sistema.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

# macOS: cor de destaque do sistema (NSColor.controlAccentColor), para o tema Sistema.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }

[dev-dependencies]
proptest = "1"
