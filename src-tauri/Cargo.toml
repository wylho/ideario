[package]
name = "ideario"
version = "0.1.0"
description = "Ideário: notas local-first com sync pelo Google Drive"
edition = "2021"
rust-version = "1.80"

[lib]
# O sufixo evita conflito de nome com o binário no Windows.
name = "ideario_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
